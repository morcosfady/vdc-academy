# Supabase CLI config (only what this project needs). `supabase link --project-ref <ref>` fills project_id.
project_id = "vdc-academy"

# All seven functions are called from the browser with `supabase.functions.invoke(name, { body })`, which sends
# the caller's JWT (a signed-in user's session, or the anon key for public forms). The gateway checks that the
# token is valid; each function then decides who may do what (see the comment at the top of each index.ts).
[functions.on-application-submitted]
verify_jwt = true

[functions.on-status-changed]
verify_jwt = true

[functions.notify-lead]
verify_jwt = true

# v9 account emails: the auth callback (signed-in user) and the admin recruiters page (admin only).
[functions.on-account-verified]
verify_jwt = true

[functions.on-recruiter-verified]
verify_jwt = true

# v10 evaluations: the admin evaluations page tells the student an evaluation was published (admin only).
[functions.on-evaluation-published]
verify_jwt = true

# v11 instructors: the admin instructors page tells the instructor the profile was approved or not (admin only).
[functions.on-instructor-verified]
verify_jwt = true
