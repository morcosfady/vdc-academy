name: Cross-browser tests

# The Playwright suite on Firefox and WebKit (Safari engine), Linux. Chromium runs locally against the Windows pixel
# snapshots; perf and lod are Chromium-only (playwright.config.ts). Manual, and on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      grep:
        description: "Only run tests whose title matches (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cross-browser
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No backend keys on purpose: the tests use the in-memory mock (?mock=1) and the demo.
      - run: pnpm build
        env:
          GITHUB_PAGES: "true"
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - run: pnpm exec playwright test --project=${{ matrix.project }} --reporter=line ${{ inputs.grep && format('-g "{0}"', inputs.grep) || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7
