name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          GITHUB_PAGES: "true"
          # "/vdc-academy" on morcosfady.github.io; set the repository variable to "/" on a custom domain (docs/CUSTOM-DOMAIN.md).
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || '/vdc-academy' }}
          # Repository secrets win; repository variables work too (Settings > Secrets and variables > Actions).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL || 'https://morcosfady.github.io/vdc-academy' }}
          NEXT_PUBLIC_AUTH_GOOGLE: ${{ secrets.NEXT_PUBLIC_AUTH_GOOGLE || vars.NEXT_PUBLIC_AUTH_GOOGLE }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # Optional, cookieless analytics (docs/ANALYTICS.md). Unset = off.
          NEXT_PUBLIC_ANALYTICS_PROVIDER: ${{ secrets.NEXT_PUBLIC_ANALYTICS_PROVIDER || vars.NEXT_PUBLIC_ANALYTICS_PROVIDER }}
          NEXT_PUBLIC_ANALYTICS_SCRIPT: ${{ secrets.NEXT_PUBLIC_ANALYTICS_SCRIPT || vars.NEXT_PUBLIC_ANALYTICS_SCRIPT }}
          NEXT_PUBLIC_ANALYTICS_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_ANALYTICS_WEBSITE_ID || vars.NEXT_PUBLIC_ANALYTICS_WEBSITE_ID }}
          NEXT_PUBLIC_ANALYTICS_DOMAIN: ${{ secrets.NEXT_PUBLIC_ANALYTICS_DOMAIN || vars.NEXT_PUBLIC_ANALYTICS_DOMAIN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
